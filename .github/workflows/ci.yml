name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Crowdhandler.NETsdk.sln

      - name: Build (Release)
        run: dotnet build Crowdhandler.NETsdk.sln -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test Crowdhandler.NETsdk.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            Crowdhandler.NETsdk/bin/Release/*.nupkg
            CrowdhandlerMVCSDK/bin/Release/*.nupkg
